name: Build & Package Social Agent Studio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to build.sh
        run: chmod +x build.sh

      - name: Run Unit Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./build.sh test

      - name: Build Debug & Release APKs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./build.sh all

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialAgent-debug-apk
          path: build-outputs/SocialAgent-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialAgent-release-apk
          path: build-outputs/SocialAgent-release-unsigned.apk
          if-no-files-found: warn
